name: Serpiente de contribuciones

on:
  schedule:
    - cron: "17 4 * * *" # una vez al día
  workflow_dispatch: # para lanzarla a mano desde la pestaña Actions
  push:
    branches: [main]
    paths: [".github/workflows/serpiente.yml"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar la serpiente (negro + azul)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente-oscuro.svg?palette=github-dark&color_snake=#51A2DA&color_dots=#161b22,#0e2a47,#1b4b7a,#2f77b5,#51A2DA
            dist/serpiente-claro.svg?color_snake=#3C6EB4&color_dots=#ebedf0,#c5dcf2,#8cc4ec,#51A2DA,#3C6EB4

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Actualizar serpiente"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
